{% extends "core/base.html" %}
{% block title %}Criar conta — MedHelper{% endblock %}

{% block content %}
<div class="card" style="max-width: 28rem; margin: 2rem auto; text-align: center">
  <p class="form-section-title">Criar conta</p>
  <p style="margin-bottom: 1.5rem">Como você quer usar o MedHelper?</p>
  <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap">
    <a href="{% url 'signup-patient' %}" class="btn btn-primary">Sou paciente</a>
    <a href="{% url 'signup-doctor' %}" class="btn btn-secondary">Sou médico</a>
  </div>
  <p style="margin-top: 1.5rem">
    Já tem conta? <a href="{% url 'login' %}">Entrar</a>
  </p>
</div>
{% endblock %}
