<tr id="appointment-{{ appointment.id }}">
  <td>{{ appointment.patient|default:"(sem paciente)" }}</td>
  <td style="white-space: nowrap">
    {{ appointment.appointment_date|date:"d/m/Y" }}<br />
    <small style="color: var(--text-secondary)">
      {{ appointment.appointment_date|time:"H:i" }}
    </small>
  </td>
  <td>{{ appointment.reason|default:"—"|truncatechars:60 }}</td>
  <td>
    <span class="badge badge-{{ appointment.status }}">
      {{ appointment.get_status_display }}
    </span>
  </td>
  <td>
    {% if appointment.is_cancellable %}
      <button
        class="btn btn-secondary"
        style="padding:.25rem .75rem; font-size:.8rem"
        hx-post="{% url 'appointment-cancel' appointment.id %}"
        hx-target="#appointment-{{ appointment.id }}"
        hx-swap="outerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        hx-confirm="Cancelar esta consulta?"
      >
        Cancelar
      </button>
    {% endif %}
  </td>
</tr>
