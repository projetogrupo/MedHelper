<button
  type="button"
  class="slot-cell{% if cell.on %} slot-on{% endif %}"
  aria-pressed="{{ cell.on|yesno:'true,false' }}"
  aria-label="{{ cell.time|time:'H:i' }}"
  hx-post="{% url 'calendar-toggle' %}"
  hx-vals='{"weekday": "{{ cell.weekday }}", "time": "{{ cell.time|time:'H:i' }}"}'
  hx-trigger="toggle-slot"
  hx-target="this"
  hx-swap="outerHTML"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
></button>
