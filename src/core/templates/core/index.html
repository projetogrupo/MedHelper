{% extends "core/base.html" %}
{% block title %}Agendar — MedHelper{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Agendamento</h1>
</div>

<div class="card">
  <p class="form-section-title">Agendar consulta</p>

  <div id="booking-result"></div>

  <form hx-post="{% url 'appointment-create' %}"
        hx-target="#booking-result"
        hx-swap="innerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        hx-on::after-request="if(event.detail.successful && event.detail.xhr.status===201) { this.reset(); htmx.trigger('#id_specialty', 'change'); }">

    {% csrf_token %}

    {% if patients %}
      <div class="form-grid">
        <div class="form-group">
          <label for="id_patient">Paciente</label>
          <select name="patient" id="id_patient" required>
            <option value="">---------</option>
            {% for p in patients %}
              <option value="{{ p.id }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    {% endif %}

    {% include "core/booking_area.html" %}

    <div class="form-group" style="margin-top: 1rem">
      <label for="id_reason">Motivo</label>
      <textarea name="reason" id="id_reason" rows="3"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Agendar</button>
      <span class="htmx-indicator" aria-live="polite">Salvando…</span>
    </div>
  </form>
</div>
{% endblock %}
