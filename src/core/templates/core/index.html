{% extends "core/base.html" %}
{% block title %}Agendar — MedHelper{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Agendamento</h1>
</div>

<div class="card">
  <p class="form-section-title">Agendar consulta</p>

  <div id="booking-result"></div>

  <form hx-post="{% url 'appointment-create' %}"
        hx-target="#booking-result"
        hx-swap="innerHTML"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
        hx-on::after-request="if(event.detail.successful && event.detail.xhr.status===201) this.reset()">

    {% csrf_token %}
    <div class="form-grid">

      {% if patients %}
        <div class="form-group">
          <label for="id_patient">Paciente</label>
          <select name="patient" id="id_patient" required>
            <option value="">---------</option>
            {% for p in patients %}
              <option value="{{ p.id }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      {% endif %}

      <div class="form-group">
        <label for="id_doctor">Médico</label>
        <select name="doctor" id="id_doctor" required
                hx-get="{% url 'booking-slots' %}"
                hx-trigger="change"
                hx-target="#slot-options"
                hx-include="closest form">
          <option value="">---------</option>
          {% for d in doctors %}
            <option value="{{ d.id }}">{{ d }} — {{ d.specialty }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="id_date">Data</label>
        <input type="date" name="date" id="id_date" required min="{{ today|date:'Y-m-d' }}"
               hx-get="{% url 'booking-slots' %}"
               hx-trigger="change"
               hx-target="#slot-options"
               hx-include="closest form" />
      </div>

      <div class="form-group" style="grid-column: 1 / -1">
        <label>Horários disponíveis</label>
        <div id="slot-options">
          <p style="color: var(--text-secondary)">Escolha um médico e uma data para ver os horários.</p>
        </div>
      </div>

      <div class="form-group" style="grid-column: 1 / -1">
        <label for="id_reason">Motivo</label>
        <textarea name="reason" id="id_reason" rows="3"></textarea>
      </div>

    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Agendar</button>
      <span class="htmx-indicator" aria-live="polite">Salvando…</span>
    </div>
  </form>
</div>
{% endblock %}
