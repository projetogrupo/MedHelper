{% extends "core/base.html" %}
{% block title %}Entrar — MedHelper{% endblock %}

{% block content %}
<div class="card" style="max-width: 24rem; margin: 2rem auto">
  <p class="form-section-title">Entrar</p>

  {% if form.errors %}
    <p class="message message--error">Usuário ou senha inválidos.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">E-mail</label>
      {{ form.username }}
    </div>
    <div class="form-group">
      <label for="id_password">Senha</label>
      {{ form.password }}
    </div>
    <input type="hidden" name="next" value="{{ next }}" />
    <div class="form-actions" style="margin-top: 1rem">
      <button type="submit" class="btn btn-primary">Entrar</button>
    </div>
  </form>

  <p style="margin-top: 1rem">
    Não tem conta? <a href="{% url 'signup' %}">Criar conta</a>
  </p>
</div>
{% endblock %}
