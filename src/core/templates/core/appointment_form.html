<div class="message message--error" style="margin-bottom:1rem">
  Corrija os erros abaixo antes de continuar.
</div>

<div class="form-grid">
  <div class="form-group">
    <label>Paciente</label>
    {{ form.patient }}
    {{ form.patient.errors }}
  </div>
  <div class="form-group">
    <label>Médico</label>
    {{ form.doctor }}
    {{ form.doctor.errors }}
  </div>
  <div class="form-group">
    <label>Data e hora</label>
    {{ form.appointment_date }}
    {{ form.appointment_date.errors }}
  </div>
  <div class="form-group">
    <label>Status</label>
    {{ form.status }}
    {{ form.status.errors }}
  </div>
  <div class="form-group" style="grid-column: 1 / -1">
    <label>Motivo</label>
    {{ form.reason }}
    {{ form.reason.errors }}
  </div>
</div>
